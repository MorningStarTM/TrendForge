# TrendForge — two services for the current architecture.
#
# The system is in-memory and single-process (no database, no Redis, no Celery),
# so there are no postgres/redis/worker/beat containers — nothing uses them.
#   - backend : FastAPI trend-detection API (scrape -> normalize -> rule engine)
#   - web     : production Next.js app (port 3000) — the main console
#   - frontend: legacy testing UI (port 3002), kept for debugging
#
# Secrets come from the gitignored .env at runtime (env_file) — never baked into
# the images. Requires SCRAPECREATORS_API_KEY, and (for the LLM stages, once
# wired) AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / BEDROCK_REGION / *_MODEL_ID.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"

  # Production web app (frontend-prod): Discover, Trends, Brand KB, Settings.
  web:
    build:
      context: ./frontend-prod
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Server-side proxy target — reach the backend over the compose network.
      BACKEND_URL: http://backend:8000
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-trendforge}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Legacy testing UI — kept for debugging. Runs on host port 3002.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-trendforge}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3002:3000"
